name: Auto Build RSS Feeds

on:
  schedule:
    # 使用 cron 表达式定义触发周期（此处示例为每 2 小时自动运行一次）
    - cron: '0 */2 * * *'
  # 支持手动在 GitHub 页面点击按钮立即触发一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境（使用 Node 20 原生 fetch）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 执行脚本抓取 RSS 数据
      - name: Generate RSS Files
        run: node generate.js

      # 4. 将生成的 dist 目录下的静态 xml 部署到 GitHub Pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages